; ============================================
; PUC 节点编号迁移映射表 (v1.0)
; 文件名: _pucfiles/_numbering_migration_map.ini
; 说明：PUC节点编号从旧格式(<十进制/字母段-M>)迁移到
;       新格式(<XXXX-YY>)的完整对照表。
;       新格式：XXXX=4位hex序号，YY=2位十进制层级(M=反斜杠数+1)
;       特殊：M=00 表示"自己节点"(__Specification__专用)
; 制定时间：2026-07-25
; ============================================

; ================ 格式定义 ================
; 旧格式: <N-M>   N=十进制或字母段(1~999 / A00~FFF / P00~PFF)
; 新格式: <XXXX-YY>  XXXX=4位hex定宽大写  YY=2位十进制定宽
; 示例:  <1-1>   -> <0000-01>
;        <C00-2> -> <0080-02>
;        <P61-3> -> <00CD-03>
; __Specification__: <最后一个节点N-00>  M=00=自己节点
; EndingKey: 值 = 最后一个有效节点的 <XXXX-YY>

