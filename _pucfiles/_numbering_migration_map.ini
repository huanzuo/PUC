; 2. EndingKey: 值=最后一个有效节点的<XXXX-YY>
; 3. 01规范的示例代码中的编号：保留原样(示例非实际节点)
; 4. 09规范的<...>占位符：保留原样
; 5. 正则描述<[1-9][0-9]?-[1-9]?>：保留原样(文档内容)
; 6. GUID：已用保留，新节点(ASSET)真随机生成
