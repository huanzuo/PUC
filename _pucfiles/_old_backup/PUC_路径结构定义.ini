[PUC\SYSTEM\STATUS_FLOW\{b5c6d7e8-f9a0-1b2c-3d4e-5f6a7b8c9d0e}]
__note__ = 状态流转路径定义 - 展示PUC元素的生命周期

STATUS_TYPES:状态类型 = DRAFT,ACTIVE,ARCHIVE,DELETED | 四种基本状态
STATE_FLOW:状态流转图 = 
DRAFT → ACTIVE → ARCHIVE → DELETED
   │        │        │        │
   ▼        ▼        ▼        ▼
草稿状态   活跃状态   归档状态   删除状态

PATH_STATUS_INTEGRATION:路径状态集成 = 
[PUC\TASK\开发\{GUID_T1}]
STATUS:任务状态 = ACTIVE | 当前状态
CREATED:创建时间 = [时间戳] | 进入DRAFT状态时间
ACTIVATED:激活时间 = [时间戳] | 进入ACTIVE状态时间  
ARCHIVED:归档时间 = [时间戳] | 进入ARCHIVE状态时间
DELETED:删除时间 = [时间戳] | 进入DELETED状态时间

