[PUC\SYSTEM\PATH_DEFINITION\{d7a8b9c1-e2f3-4a5b-8c6d-9e0f1a2b3c4d}]
__note__ = PUC路径结构核心定义 - 显示所有标准一级域和层级关系

ROOT_NOTE:根节点 = PUC\STANDARD | 文件元数据根节点

LEVEL1_DOMAINS:一级功能域列表 = APP,TASK,DATA,LIB,NOTE,CONFIG,TEMPLATE,LOG | 八个标准一级域
LEVEL1_PATHS:一级路径示例 = 
PUC\APP\ = 应用配置域,
PUC\TASK\ = 任务管理域,  
PUC\DATA\ = 数据配置域,
PUC\LIB\ = 公共库域,
PUC\NOTE\ = 笔记记录域,
PUC\CONFIG\ = 系统配置域,
PUC\TEMPLATE\ = 模板管理域,
PUC\LOG\ = 日志跟踪域

LEVEL2_REQUIREMENT:二级节点要求 = GUID_REQUIRED | 所有二级节点必须有GUID
GUID_FORMAT:格式 = xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx | 标准UUID格式

PATH_SEPARATOR:路径分隔符 = \ | 反斜杠作为层级分隔符
MAX_DEPTH:最大深度 = 255 | 路径最大层级数

[PUC\SYSTEM\PATH_EXAMPLES\{f8e7d6c5-b4a3-2f1e-0d9c-8b7a6f5e4d3c}]
__note__ = PUC路径示例 - 展示完整路径结构

EXAMPLE_1:一级到二级路径 = PUC\APP\项目A\{GUID_A} | 标准二级节点格式
EXAMPLE_2:深度扩展路径 = PUC\APP\项目A\{GUID_A}\MODULES\模块1\COMPONENTS\组件1 | 多级扩展
EXAMPLE_3:任务域示例 = PUC\TASK\开发\{GUID_T1}\SUBTASKS\需求分析\STEPS\步骤1 | 任务分解

PATH_VISUALIZATION:路径可视化 = 
ROOT → [PUC\STANDARD]
     ├─→ [PUC\APP\] → [PUC\APP\项目A\{GUID_A}] → [PUC\APP\项目A\{GUID_A}\MODULES\...]
     ├─→ [PUC\TASK\] → [PUC\TASK\开发\{GUID_T1}] → [PUC\TASK\开发\{GUID_T1}\SUBTASKS\...]
     ├─→ [PUC\DATA\] → [PUC\DATA\数据集\{GUID_D1}] → [PUC\DATA\数据集\{GUID_D1}\RECORDS\...]
     ├─→ [PUC\LIB\] → [PUC\LIB\工具库\{GUID_L1}] → [PUC\LIB\工具库\{GUID_L1}\FUNCTIONS\...]
     ├─→ [PUC\NOTE\] → [PUC\NOTE\会议记录\{GUID_N1}] → [PUC\NOTE\会议记录\{GUID_N1}\TOPICS\...]
     ├─→ [PUC\CONFIG\] → [PUC\CONFIG\系统配置\{GUID_C1}] → [PUC\CONFIG\系统配置\{GUID_C1}\SETTINGS\...]
     ├─→ [PUC\TEMPLATE\] → [PUC\TEMPLATE\文档模板\{GUID_TP1}] → [PUC\TEMPLATE\文档模板\{GUID_TP1}\SECTIONS\...]
     └─→ [PUC\LOG\] → [PUC\LOG\操作日志\{GUID_LG1}] → [PUC\LOG\操作日志\{GUID_LG1}\ENTRIES\...]

[PUC\SYSTEM\ANNOTATION_HIERARCHY\{c3b2a1d0-e9f8-7c6b-5a4d-3f2e1d0c9b8a}]
__note__ = 三层次注释系统在路径中的应用位置

SECTION_ANNOTATION:节注释 = 通过__note__键 | 每个节可以有节注释
KEY_ANNOTATION:键注释 = 键名:注释 | 键名后跟冒号和注释
VALUE_ANNOTATION:值注释 = 值 | 注释 | 值后跟竖线和注释

ANNOTATION_EXAMPLE:完整注释示例 = 
[PUC\APP\项目A\{GUID_A}\DATABASE]
__note__ = 数据库配置节
HOST:主机地址 = 127.0.0.1 | 本地数据库
PORT:端口号 = 3306 | MySQL默认端口
USER:用户名 = root | 管理员账户
PASSWORD:密码 = ****** | 加密存储
DB_NAME:数据库名 = project_a | 项目数据库

