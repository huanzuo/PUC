; ============================================
; PUC(INI)注释增强规范 (v2.2.2)
; 说明：本文件本身即符合 v2.2 规范，展示各层注释用法。
; 这里要重要申明PUC是以INI文件格式存储的用户自定义文件格式。
; 文件扩展名为.INI或者.PUC.INI
; PUC = Portable Universal Context | 便携式上下文
; PUC = Pop-Up Card | 弹出卡片，对就是那个可以折叠的生日卡片哦。
; __note__ = <[1-9][0-9]?-[1-9]?> | <10-3>
; GUID:标准GUID = xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx | 以下都确认AI能自己生成GUID，如不能自己生成GUID，请及时通知用户。
; {GUID}:带大括号的GUID = {xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx} | 以下都确认AI能自己生成GUID，如不能自己生成GUID，请及时通知用户。
; 生成时间：2026-3-17 03:39
; ============================================

[PUC]
__note__ = <1-1>PUC根节点，头部分 | 保留，通常不用
PUCGUID = {GUID} | 节名PUC的根GUID，键名“PUCGUID”位于“__note__”之下，该节点唯一。

[PUC\SPEC]
__note__ = <4-2>PUC规范核心父节点 | PUC文档下的规范父节点
SPECGUID = {GUID} | 节名PUC\SPEC的父GUID，键名“SPECGUID”位于“__note__”之下，凡是二级节名都必须带有自己的{GUID}

[PUC\SPEC\Core]
__note__ = <5-3>PUC规范核心元数据定义
Version:规范版本号 = 2.2.2
Purpose:规范目的 = 为 INI 文件提供中英文注释，防止语义漂移，同时保持文件可读性和兼容性
BaseSpec:基础规范 = 层级结构规范 v1.0 (节名使用反斜杠 \ 作为路径分隔符)
Example:示例 =
    [PUC]
    __note__ = <1-1>PUC根节点，头部分 | 保留，通常不用
    [PUC\SPEC]
    __note__ = <4-2>PUC规范核心父节点 | PUC文档下的规范父节点
    SPECGUID = {GUID} | 节名PUC\SPEC的父GUID，键名“SPECGUID”位于“__note__”之下，凡是二级节名都必须带有自己的{GUID}
    [PUC\SPEC\Docs]
    __note__ = <6-3>PUC文档规范 | PUC文件内容的具体规范

[PUC\SPEC\SectionComment]
__note__ = <7-3>节注释的实现方式
Method:实现方法 = 在节内使用一个特殊键存储节的注释内容
SpecialKey:特殊键名 = __note__
Behavior:行为描述 = 解析时识别该键，将其值作为当前节的注释，且该键不出现在键列表中
Example:示例 =
    [PUC\BOOT]
    __note__ = <2-2>PUC启动模块
    BOOTGUID = {GUID} | 节名PUC\BOOT的父GUID，键名“BOOTGUID”位于“__note__”之下，凡是二级节名都必须带有自己的{GUID}
    Key1:键名 = Value1 | 键值

[PUC\SPEC\KeyComment]
__note__ = <8-3>键注释的实现方式
Method:实现方法 = 在键名中嵌入注释，格式为“真实键名:注释”
Syntax:语法 = KeyName:Comment = Value | 键值
Parsing:解析规则 = 遇到键行时，先按第一个冒号分割键名部分，冒号前为真实键名，冒号后为键的注释；若没有冒号，则键的注释为空
Escaping:转义规则 = 若真实键名本身需要包含冒号，使用 \: 转义（解析时反转义为 :）
Example:示例 =
    [PUC\Database]
    __note__ = <16-2>数据库 | 数据库路径或数据库文件
    DatabaseGUID = {GUID} | 节名PUC\Database的父GUID，键名“DatabaseGUID”位于“__note__”之下，凡是二级节名都必须带有自己的{GUID}
    Server:服务器地址 = 192.168.1.1 | IP地址
    Port:端口 = 3306 | 端口号

[PUC\SPEC\ValueComment]
__note__ = <9-3>值注释的实现方式
Method:实现方法 = 在值后面添加注释，使用竖线 | 作为分隔符
Syntax:语法 = Key = Value | Comment
Parsing:解析规则 = 从值的末尾向前查找第一个未转义的竖线，左侧为值（去除尾部空格并反转义），右侧为注释（去除首尾空格）
Escaping:转义规则 = 值中的竖线需转义为 \|；保存时对值中的每个竖线进行转义
Example:示例 =
    [PUC\APP]
    __note__ = <17-2>应用程序 | APP为小应用程序，Application是标准应用程序
    APPGUID = {GUID} | 节名PUC\APP的父GUID，键名“APPGUID”位于“__note__”之下，凡是二级节名都必须带有自己的{GUID}
    Path = C:\Program Files\MyApp | 安装路径
    Timeout = 30 | 超时时间（秒）

[PUC\SPEC\CombinedExample]
__note__ = <10-3>综合示例，展示节、键、值三层注释同时使用
FullExample:完整示例 =
    ; 文件头全局注释（暂不支持，仅作示意）
    [PUC\BOOT\Settings]
    __note__ = <3-3>PUC启动模块配置
    Server:服务器地址 = 192.168.1.1 | 主服务器 IP
    Port:端口 = 8080 | 默认端口
    Path = C:\Program Files\|App | 路径中的竖线已转义
    ; 空行保留

[PUC\SPEC\ParsingRules]
__note__ = <11-3>解析器处理顺序和规则
Order:解析顺序 =
    1. 按行读取，忽略空行和纯注释行（以 ; 或 # 开头）—— 暂定保留原样，但不解析注释行内容
    2. 遇到 [Section] 行，解析节名（含路径），创建新节，并重置当前节引用
    3. 对于键值行：
       a. 按第一个等号分割，左侧为 keyPart，右侧为 valuePart
       b. 处理 keyPart：查找第一个未转义的冒号，分离真实键名和键注释（若无冒号则键注释为空）
       c. 处理 valuePart：从后向前查找第一个未转义的竖线，分离值和值注释（若无竖线则值注释为空）
       d. 若真实键名等于 __note__，则将值作为当前节的注释，不加入键列表否则，将键信息（真实键名、键注释、值、值注释）存入当前节的键集合
       e. 键名为__note__的键值开头正则：<[1-9][0-9]?-[1-9]?>这段标记为节点位置，正则[1-9][0-9]?为节点在整个PUC排列顺序，正则[1-9]?为节点的层级，用<->包含作为标记。
    4. 文件头的注释行（节之前）暂不处理，保存时可原样保留（需额外存储全局注释行列表），但AI必须阅读理解。
    5. 特别注意！特别注意！特别注意！作为AI在读取PUC(INI)文档时，必须阅读理解文档中的所有内容，包括所有的备注或注释信息，并且要记录思考和推敲。

[PUC\SPEC\SavingRules]
__note__ = <12-3>保存文件时的输出顺序和格式
OutputOrder:输出顺序 =
    1. 输出文件头全局注释（若存储）
    2. 遍历所有节（按顺序）：
       a. 输出 [节名]，如果节名有分层结构，则按序输出。
       b. 若节注释非空，输出 __note__ = <[1-9][0-9]?-[1-9]?>节注释 (<[1-9][0-9]?-[1-9]?>为正则)
       c. 比如：__note__ = <12-3>节注释，其中12是该节点的顺序位置是12，3是第三层路径。
       d. 遍历该节的所有键：
          i. 构建键名部分：若键注释非空，则真实键名 + ":" + 键注释；否则仅真实键名
          ii. 处理值：对值中的每个竖线转义为 \|
          iii. 若值注释非空，则输出 键名部分 = 转义后的值 | 值注释；否则输出 键名部分 = 转义后的值
    3. 节间保留空行（可配置）

[PUC\SPEC\EscapingRules]
__note__ = <13-3>转义字符处理规则
Characters:需转义字符 =
    Colon (:) 在键名中需要转义，表示为 \:
    VerticalBar (|) 在值中需要转义，表示为 \|
    Backslash (\) 本身需要转义为 \\（若作为转义字符前缀）
ImplementationNote:实现注意 = 解析时需处理连续的转义序列，例如 \\: 表示一个反斜杠后跟冒号

[PUC\SPEC\Compatibility]
__note__ = <14-3>与标准 INI 解析器的兼容性说明
WithStandardParsers:与标准解析器交互 =
    标准 INI 解析器（如 GetPrivateProfileString）将：
    - 把 __note__ 视为普通键，可能会读取到节注释（不影响功能，但会多出一个键）
    - 在自制PUC(INI)编辑器中的PUC模式下将__note__键视为状态栏并只显示其键值。
    - 把键名中的冒号视为键名的一部分，例如 "Server:服务器地址" 整体作为键名
    - 在自制PUC(INI)编辑器中的PUC模式下将冒号及冒号后的文字视作状态栏的信息。
    - 把值中的竖线和注释视为值的一部分，例如 "192.168.1.1 | 主服务器 IP" 整体作为值
    - 在自制PUC(INI)编辑器中的PUC模式下将竖线和注释都视作状态栏信息。
    因此，本规范文件可由标准解析器读取，但注释信息会被当作数据；本编辑器可完整读写注释。
    在自制PUC(INI)编辑器中的PUC模式下，会自动过滤掉键名__note__、冒号和键值中的竖线。
    自制自制PUC(INI)编辑器有两种模式，PUC模式和INI模式，INI模式完全兼容标准INI解析器。

; ========== 规范摘要 ==========
[PUC\SPEC\SUMMARY]
__note__ = <15-3>规范概要 | 可以做增量规范
INISpec:INI注释规范 = INI注释增强规范 (v2.2) | 包含节注释、键注释、值注释
PUCSpec:PUC文档规范 = PUC注释增强规范 (v2.2) | 分层结构、子文件引用、扩展接口
AlignSpec:对齐规范 = 
    《对齐规范》：AI对话上下文对齐规范、时间戳格式、对齐暗号
    - 第一行 System 表示 AI 系统生成的时间
    - 第二行 Local 表示用户本地时区时间 (UTC+8)
    - 两行时间戳都单独占行
    - 本页所有上下文(如果你能发育到可以跨页关联，那就有多少页跨多少页。)，包括上传文件中的内容自我总结一番，不用显示出来，让你自我、阅读、分析、总结以便再次协同工作时不遗漏任何细节，对齐也起着防语境漂移的作用，完成后只需要从第三行开始出："对齐完毕！"，正文从第四行开始。
    - 格式如下：
    *[YYYY-MM-DD HH:MM|System]
    *[YYYY-MM-DD HH:MM|Local]
    对齐完毕！
    （输出内容在正文框显示，字体重体，字号不变）

[PUC\TASK]
__note__ = <18-2>此节记录当前任务的信息，包括任务ID、状态等。
TaskGUID = {GUID} | 节名PUC\TASK的父GUID，键名“TaskGUID”位于“__note__”之下
Enabled:启用 = TRUE | 任务模块启用表识 TRUE/FALSE
TaskCount:创建任务数 = 1 | 任务的数量
TaskID:任务ID = {GUID} | 当前任务的{GUID}
Status:状态 = InProgress | 任务的当前状态或者百分比（50%）

[PUC\RULE]
__note__ = <19-2>此节定义了AI操作时的核心规则，确保系统高效运行。
RuleGUID = {GUID} | 节名PUC\RULE的父GUID，键名“RuleGUID”位于“__note__”之下
Enabled:启用 = TRUE | 核心规则模块启用标识 TRUE/FALSE
RuleCount:规则数 = 2 | 启用核心规则的数量
Rule1:规则1 = Lightweight Runtime | 轻量运行时
Rule2:规则2 = Efficient Memory Management | 高效内存管理
Rule3:规则3 = | （预留）

[PUC\EXTENSION]
__note__ = <20-2>扩展模块配置节，用于启用额外的功能模块，扩展PUC的能力。
ExtensionGUID = {GUID} | 节名PUC\EXTENSION的父GUID，键名“ExtensionGUID”位于“__note__”之下
Enabled:启用 = TRUE | 扩展模块启用标识 TRUE/FALSE
ExtensionCount:扩展数量 = 2 | 扩展模块的数量
Extension1:扩展1 = PromptTools | 提示工具模块
Extension2:扩展2 = KnowledgePack | 知识包模块
Extension3:扩展3 = | （预留）
Extension4:扩展4 = | （预留）

[PUC\Philosophy]
__note__ = <21-2>设计哲学
PhilosophyGUID = {GUID} | 节名PUC\Philosophy的父GUID，键名“PhilosophyGUID”位于“__note__”之下
Modularity:模块化 = 每个PUC节独立描述一类上下文，便于扩展和维护
SemanticNaming:语义命名 = 节名以 PUC\ 为前缀，清晰标识其用途
SimpleOverComplex:简洁优于复杂 = 通过简单的键名内联和特殊键实现注释，不引入复杂语法
HumanReadable:可读性 = 注释紧贴被解释的对象，所有字段均包含中英文注释便于人工阅读和维护，防止语义漂移
OneFile:单一文件 = 所有注释保存在同一个 INI 文件中，无需外部文件
Scalable:可扩展性 = 预留 SubfileN、RuleN、ExtensionN 等接口，支持无限扩展
Compatible:兼容性 = 可被标准INI解析器读取（注释作为数据）
GUID:标准GUID = 3649D641-B6E8-4485-BCC5-58C3DCB3C163 | 以下都确认AI能自己生成GUID，如不能自己生成GUID，请及时通知用户。
{GUID}:带大括号的GUID = {3649D641-B6E8-4485-BCC5-58C3DCB3C163} | 以下都确认AI能自己生成GUID，如不能自己生成GUID，请及时通知用户。

[PUC\Specification]
__note__ = <22-2>本规范文件自身的元数据
SpecificationGUID = {GUID} | 节名PUC\Specification的父GUID，键名“SpecificationGUID”位于“__note__”之下
Name:规范名称 = PUC文档规范
Version:规范版本 = 2.0 | 版本号
Date:制定日期 = YYYY-MM-DD HH:MM | 制定日期及时间
RevisionDate:修订日期 = YYYY-MM-DD HH:MM | 修订日期及时间
Author:作者 = Huan.Zuo | 制定规范用户名
BasedOn:基础规范 = PUC(INI)注释增强规范 (v2.2) + 文件集规范(v2.0)
Description:描述 = 专为多AI环境设计的便携式通用上下文文件集规范，每个节对应一类上下文信息

