; ============================================
; 虽然是注释内容，但也是非常重要且必须阅读的内容。
; 文件名: 11_PUC_Agent_Prompt_Spec.puc.ini
; PUC（Portable Universal Context） | 便携式上下文
; Agent Prompt 设计规范 - 定义AI智能体的角色、能力、边界与交互模式
; 本规范基于PUC 00-10文档结构，为AI Agent的Prompt设计提供标准化框架
; ============================================

[PUC]
__note__ = <1-1> PUC标志根节点头部分 | 保留节点，用作PUC文档的根标识与行为锚点（Behavior Anchor）。
PUC_GUID = {A5E7F3B2-9C8D-4E6A-A1B3-C5D8E7F2A4B6} | 节名"PUC"的GUID，键名"PUC_GUID"位于"__note__"之下，该节点为唯一及定位使用。
BehaviorAnchor:行为锚点 = 用于AI在执行Agent Prompt相关任务时的注意力重置、任务边界声明、执行模式约束。此锚点不参与动作，但作为AI行为的"偏移校正点"存在。
BehaviorAnchor_ExecutionMode:执行模式声明 = 
    - 本文档涉及的所有任务均以"工程执行模式（Execution Mode）"处理。
    - 禁止进入对话模式、情绪模式、拟人化模式。
    - 禁止推断、禁止省略、禁止自动合并任务。
    - 所有指令必须逐条执行，不得跳过、不得弱化。
BehaviorAnchor_TaskBoundary:任务边界声明 =
    - 每次任务包含静态指令（定义/约束）与动态指令（动作/生成）。
    - AI 必须同时处理静态与动态两类指令，不得偏移注意力。
    - 静态指令具有与动态指令等同的优先级。
    - 若出现冲突，以"任务边界声明"为最高优先级。
BehaviorAnchor_AttentionReset:注意力重置规则 =
    - 当上下文过长、注意力漂移、角色偏移时，AI 必须自动回到本锚点。
    - 本锚点作为"零偏移点（Zero-Drift Point）"用于恢复执行精度。
    - 若AI无法确定当前任务状态，必须回到此锚点重新建立任务边界。

