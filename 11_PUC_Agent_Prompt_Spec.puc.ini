; ================ __Specification__：规范元数据 ================
[__Specification__]
__note__ = 本文件自身的元数据 | 规范元数据尾节——声明文档身份、结构设计意图与版本历史。
__Specification___GUID = {BDC7C3A5-EB99-4C9B-B89B-23A4BD1D43CA} | 规范元数据的唯一GUID（使用PUC体系根GUID作为标记）
EndingKey:增量节尾 = <E70-4> | 本规范最后一个有效节点的顺序号
Name:规范名称 = PUC Agent Prompt 规范
Version:规范版本 = 1.0
Date:制定日期 = 2026-07-25 | 初始版本
BasedOn:基础规范 = PUC注释增强规范 v3.0.7 + PUC文件集规范 v3.0.6 + PUC-AI载入规范 v1.0 + PUC-AI_Knowledge_Base v1.0
Description:描述 = 
    - 提示词（Prompt）是面向AI的指令语言——本规范将其工程化、标准化。
    - 纳入PUC\AGENT体系：提示词规范独立于通用PUC规范，但通过AGENT节完整挂接，避免体系膨胀。
    - 覆盖全生命周期：结构骨架（11要素）→ 设计原则（6铁律）→ 模板体系（3层级）→ 场景（8方向）→ 实践（18条）→ 限制（12条）→ 质量（6指标）→ 审查（18项清单）。
    - 与PUC规范家族关系：01提供格式基础、02提供结构框架、06定义Agent如何载入本规范产出的Prompt、08定义Agent如何引用知识库。
StructureDescription:结构说明 = 
    - 采用标准PUC三层注释格式（__note__ + 键:注释 = 值 | 值注释）
    - 所有节点均使用真随机GUID标识，键名采用全路径格式（节名_GUID）
    - 节点编号遵循<N-M>规范：N为全局序号（E50-E90号段），M为层级深度（反斜杠数+1）
    - 信息融合到BOOT节点——不使用独立的__Info__/__Meta__/__Author__节点
DesignIntent:设计意图 = 
    - 为AI Agent开发人员提供完整的Prompt设计规范，覆盖从设计到维护的全生命周期
    - 建立标准化的Prompt模板体系，提高设计效率和质量一致性
    - 定义可量化的质量指标和可操作的检查清单，确保Prompt质量可控
    - 支持版本管理和迭代优化，适应不断变化的AI模型和能力
UsageScenario:使用场景 = 
    - AI Agent开发人员设计新Agent时参考本规范的结构骨架和模板
    - 现有Agent的Prompt优化和重构时逐一对照检查清单
    - Agent质量评估和审核时使用6维度质量指标
    - Agent团队协作和知识共享时基于统一的命名和结构约定
VersionHistory:版本历史 = 
    - v1.0 (2026-07-25): 初始版本，定义Agent Prompt核心规范，纳入PUC\AGENT体系
RelatedDocuments:相关文档 = 
    - 00_README.puc.ini: PUC总体介绍与体系树
    - 01_PUC_Comment_Enhancement_Spec.puc.ini: 注释增强规范（格式基础）
    - 02_PUC_Document_Set_Spec.puc.ini: 文档集规范（结构框架）
    - 06_PUC_AI_Launch_Spec.puc.ini: AI载入规范（Agent启动与Prompt载入）
    - 08_PUC_AI_Knowledge_Base.puc.ini: 知识库规范（Agent知识引用）

