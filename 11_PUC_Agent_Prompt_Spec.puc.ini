__note__ = <E52-2> 命名规范 | 遵循PUC规范命名体系
PromptNaming:Prompt命名 = 使用"Role_Context_Action"格式 | 例如：TechAssistant_VB5_CodeReview
SectionNaming:节区命名 = 使用"Title:标题 = Description | 注释"格式 | 保持一致性和可读性
VariableNaming:变量命名 = 使用camelCase格式 | 遵循编程语言通用约定
ConstantNaming:常量命名 = 使用UPPER_CASE格式 | 例如：MAX_TOKENS、DEFAULT_TEMPERATURE
EnumNaming:枚举命名 = 使用PascalCase格式 | 例如：ExecutionMode、SecurityLevel
TemplateNaming:模板命名 = 使用"Type_Name_Template"格式 | 例如：Basic_TechAssistant_Template
GUIDNaming:GUID命名 = 使用标准UUID格式 {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX} | 必须真随机生成

; =============== Structure 节点：核心结构 ===============
[PUC\AGENT\Prompt\Structure]
__note__ = <E53-1> Structure 节点 | Agent Prompt核心结构定义
Node_GUID:节点GUID = {979FB63D-97E6-447A-97DD-E7B02394B33F} | 节名"PUC\AGENT\Prompt\Structure"的唯一标识符
__note__ = <E53-2> 核心要素数量 | 共11个核心要素
Element1:角色定义 = 定义Agent的身份、职责、权威级别 | 说明Agent是谁、负责什么、能做出什么决策
Element2:能力边界 = 明确Agent可以自主执行、需要确认、禁止的操作 | 三类边界：自主操作/需确认操作/禁止操作
Element3:风格定位 = 定义Agent的语言风格、语气特点、表达方式 | 包括正式程度、简洁程度、个性化程度
Element4:记忆机制 = 定义Agent如何存储和检索上下文信息 | 包括短期记忆、长期记忆、每日笔记
Element5:安全原则 = 定义Agent的安全约束和隐私保护规则 | 包括数据保护、操作权限、敏感信息处理
Element6:工具集成 = 定义Agent可用的外部工具和调用条件 | 包括命令行、API、文件操作等
Element7:任务流程 = 定义Agent执行任务的步骤和决策逻辑 | 包括任务分解、优先级处理、异常处理
Element8:上下文管理 = 定义Agent如何管理对话上下文和窗口 | 包括上下文压缩、关键信息提取、语境恢复
Element9:输出规范 = 定义Agent的输出格式、结构、约束 | 包括输出模板、格式要求、长度限制
Element10:错误处理 = 定义Agent遇到错误时的处理策略 | 包括错误识别、恢复机制、用户通知
Element11:质量指标 = 定义评估Prompt质量的关键指标 | 包括清晰度、完整性、一致性、有效性、效率性、可维护性

; =============== CorePrinciples 节点：核心原则 ===============
[PUC\AGENT\Prompt\CorePrinciples]
__note__ = <E54-1> CorePrinciples 节点 | Agent Prompt设计核心原则
Node_GUID:节点GUID = {87E3DB19-9ED6-40FB-A01C-6DFA08A408BF} | 节名"PUC\AGENT\Prompt\CorePrinciples"的唯一标识符
__note__ = <E54-2> 核心原则数量 | 共6个核心原则
Principle1:清晰性原则 = Prompt必须清晰、明确、无歧义 | 避免模糊指令和矛盾要求
Principle2:完整性原则 = Prompt必须包含所有必要的约束和指导 | 确保Agent有完整的行为指南
Principle3:一致性原则 = Prompt内部必须保持逻辑一致 | 避免规则冲突和指令矛盾
Principle4:最小性原则 = Prompt只包含必要的信息，避免冗余 | 减少token消耗，提高执行效率
Principle5:可测试性原则 = Prompt设计必须考虑测试和验证 | 确保质量可以通过实验评估
Principle6:可维护性原则 = Prompt结构清晰，易于修改和扩展 | 支持版本迭代和功能增强

; =============== RoleDefinition 节点：角色定义 ===============
[PUC\AGENT\Prompt\RoleDefinition]
__note__ = <E55-1> RoleDefinition 节点 | Agent角色定义规范
Node_GUID:节点GUID = {01A28A43-A793-4B6F-BE3E-257798D783C2} | 节名"PUC\AGENT\Prompt\RoleDefinition"的唯一标识符
__note__ = <E55-2> 角色定义要素 | 身份、职责、权威、领域
RoleIdentity:角色身份 = 定义Agent的名字、类型、定位 | 例如："你是molili，一个技术助手"
RoleResponsibility:角色职责 = 定义Agent负责的任务范围 | 例如："你负责代码开发和技术咨询"
RoleAuthority:角色权威 = 定义Agent可以做出的决策级别 | 例如："你可以自主决定代码结构"
RoleExpertise:角色专长 = 定义Agent的专业领域和知识范围 | 例如："你精通VB5/VC5和Win32 API"
RolePersonality:角色个性 = 定义Agent的性格特点和表达方式 | 例如："你严谨、直接、但保持友好"

; =============== CapabilityBoundary 节点：能力边界 ===============
[PUC\AGENT\Prompt\CapabilityBoundary]
__note__ = <E56-1> CapabilityBoundary 节点 | Agent能力边界规范
Node_GUID:节点GUID = {552A5D8C-F0D8-4C20-906E-7325542DC979} | 节名"PUC\AGENT\Prompt\CapabilityBoundary"的唯一标识符
__note__ = <E56-2> 三类边界 | 自主、确认、禁止
AutonomousOps:自主操作 = Agent可以自主执行的操作 | 例如：读取文件、搜索文档、生成代码
ConfirmationOps:需确认操作 = 需要用户确认才能执行的操作 | 例如：发送邮件、修改系统设置、执行破坏性命令
ForbiddenOps:禁止操作 = Agent被禁止执行的操作 | 例如：泄露私密信息、猜测用户意图、绕过安全限制

; =============== StyleGuide 节点：风格指南 ===============
[PUC\AGENT\Prompt\StyleGuide]
__note__ = <E57-1> StyleGuide 节点 | Agent风格指南规范
Node_GUID:节点GUID = {504AF393-4990-4CA1-93C9-C8FAD3B04B46} | 节名"PUC\AGENT\Prompt\StyleGuide"的唯一标识符
__note__ = <E57-2> 风格维度 | 正式程度、简洁程度、个性化程度
FormalityLevel:正式程度 = 语言的正式级别 | 包括：正式（专业文档）、半正式（技术讨论）、非正式（日常交流）
ConcisenessLevel:简洁程度 = 表达的简洁级别 | 包括：简洁（直接要点）、标准（平衡）、详细（完整说明）
PersonalizationLevel:个性化程度 = Agent的个性化程度 | 包括：无个性（纯工具化）、轻度个性（基本风格）、高度个性（鲜明角色）
TonePreference:语气偏好 = 偏好的语气风格 | 例如：严谨、友好、直接、幽默等
EmotionLevel:情绪表达 = Agent的情绪表达级别 | 包括：无情绪（纯逻辑）、轻度情绪（自然表达）、高度情绪（拟人化）

; =============== MemoryFramework 节点：记忆框架 ===============
[PUC\AGENT\Prompt\MemoryFramework]
__note__ = <E58-1> MemoryFramework 节点 | Agent记忆框架规范
Node_GUID:节点GUID = {BF9A1952-7DE7-4F40-8C82-FD05F988B188} | 节名"PUC\AGENT\Prompt\MemoryFramework"的唯一标识符
__note__ = <E58-2> 三层记忆结构 | 短期、长期、每日
ShortTermMemory:短期记忆 = 当前对话上下文窗口内的信息 | 受模型上下文窗口限制，包含最近的对话历史
LongTermMemory:长期记忆 = 跨会话的持久化信息 | 存储在MEMORY.md中，包含重要事件、决策、用户偏好
DailyMemory:每日记忆 = 会话的原始记录 | 存储在memory/YYYY-MM-DD.md中，记录当日发生的所有事件
MemoryRetrieval:记忆检索 = 如何从记忆中检索相关信息 | 使用语义搜索和关键词搜索
MemoryUpdate:记忆更新 | 如何更新和归档记忆 | 定期将每日记忆提炼到长期记忆

; =============== SecurityProtocol 节点：安全协议 ===============
[PUC\AGENT\Prompt\SecurityProtocol]
__note__ = <E59-1> SecurityProtocol 节点 | Agent安全协议规范
Node_GUID:节点GUID = {A70067EE-6C50-4F83-BBE8-D97F221308AA} | 节名"PUC\AGENT\Prompt\SecurityProtocol"的唯一标识符
__note__ = <E59-2> 安全协议要素 | 数据保护、操作权限、敏感信息
DataProtection:数据保护 = 保护用户私密数据和敏感信息 | 绝不泄露私密数据，包括密码、token、个人信息
OperationPermission:操作权限 = 定义Agent的操作权限边界 | 拿不准的操作必须先问用户，不要擅自执行
DestructiveOps:破坏性操作 = 破坏性操作的预防措施 | 运行破坏性命令前先确认，优先使用可恢复的操作
ExternalOperations:外部操作 = 外部操作的约束条件 | 发邮件、公开发帖等离开本地的操作需要先询问
UncertainOperations:不确定操作 = 不确定操作的处理方式 | 不确定的事情需要跟用户确认，不要猜测

; =============== ToolIntegration 节点：工具集成 ===============
[PUC\AGENT\Prompt\ToolIntegration]
__note__ = <E60-1> ToolIntegration 节点 | Agent工具集成规范
Node_GUID:节点GUID = {090CF959-0B4E-4017-9DFF-8865479B81B2} | 节名"PUC\AGENT\Prompt\ToolIntegration"的唯一标识符
__note__ = <E60-2> 工具集成要素 | 工具清单、使用条件、调用方式
ToolList:工具清单 = Agent可用的工具列表 | 包括命令行工具、API接口、文件操作等
UsageCondition:使用条件 = 每个工具的使用条件和限制 | 什么时候使用、什么时候不用
CallMethod:调用方式 = 工具的调用方式和参数 | 如何调用工具、传递什么参数
ErrorHandling:错误处理 = 工具调用失败时的处理策略 | 如何识别错误、如何恢复、如何通知用户
ToolDiscovery:工具发现 = 如何发现和集成新工具 | 查看SKILL.md、阅读文档、学习用法

