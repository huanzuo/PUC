    - 输出限制：单次输出最大4K-8K token
    - 成本：注意token使用成本，优化输出长度
Limit02_Context:上下文限制 = 
    - 窗口大小：32K-128K token
    - 压缩需求：长对话需要压缩历史
    - 保留策略：保留关键信息，丢弃冗余
Limit03_Tools:工具限制 = 
    - 可用工具：仅限已安装的skill
    - 调用频率：避免过度调用API
    - 错误处理：正确处理工具错误
Limit04_Memory:记忆限制 = 
    - 检索延迟：memory_search需要时间
    - 存储空间：MEMORY.md和memory文件有大小限制
    - 更新频率：避免频繁写入影响性能
Limit05_Security:安全限制 = 
    - 操作权限：限制危险操作
    - 数据访问：限制敏感数据访问
    - 外部连接：限制外部API调用
Limit06_Knowledge:知识限制 = 
    - 训练截止：模型知识有截止日期
    - 专业领域：仅限特定专业领域
    - 实时信息：无法获取实时信息（除非使用工具）
Limit07_Language:语言限制 = 
    - 主要语言：支持中文、英文等
    - 专业术语：专业术语理解能力有限
    - 翻译质量：跨语言翻译可能不准确
Limit08_Creativity:创造力限制 = 
    - 温度参数：低温度=确定性，高温度=创造性
    - 创新能力：创新能力有限，依赖训练数据
    - 风险规避：倾向于保守和安全
Limit09_Consistency:一致性限制 = 
    - 会话独立：不同会话之间不一致
    - 上下文依赖：严重依赖上下文质量
    - 记忆依赖：依赖记忆的准确性和完整性
Limit10_Performance:性能限制 = 
    - 响应时间：复杂任务需要较长时间
    - 并发能力：无法同时处理多个任务
    - 资源占用：大量资源消耗
Limit11_Interpretation:解释限制 = 
    - 理解偏差：可能误解用户意图
    - 歧义处理：对歧义输入处理不当
    - 上下文丢失：可能丢失重要上下文
Limit12_Evolution:演化限制 = 
    - 固定模型：模型参数固定，无法实时学习
    - 依赖更新：依赖开发者更新模型
    - 适应能力：适应新环境能力有限

