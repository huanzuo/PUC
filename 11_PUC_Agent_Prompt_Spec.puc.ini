; ================ BestPractices：最佳实践 ================
[PUC\AGENT\Prompt\BestPractices]
__note__ = <E64-4> BestPractices 最佳实践 | Prompt工程的18条实战经验
PUC\AGENT\Prompt\BestPractices_GUID = {3D4D0F19-64C0-4C09-BFE3-0E1723C5981D} | 节名GUID
PracticeCount:最佳实践数 = 18 | 本节点定义的最佳实践条目数
Practice1:从简到繁 = 先创建基础模板，再逐步添加功能 | 避免一次性设计过于复杂的Prompt
Practice2:角色清晰 = 明确定义Agent的身份和职责 | 避免模糊不清的角色定位
Practice3:边界明确 = 清楚划分自主、确认、禁止操作 | 避免权限混乱和误操作
Practice4:风格一致 = 保持Prompt内部的语言风格一致 | 避免风格冲突和混淆
Practice5:测试驱动 = 设计Prompt后立即进行测试验证 | 确保实际效果符合预期
Practice6:迭代优化 = 根据测试结果持续优化Prompt | 通过小步迭代提升质量
Practice7:文档记录 = 记录Prompt的设计决策和使用经验 | 为未来的修改和维护提供参考
Practice8:版本管理 = 对Prompt进行版本控制和标记 | 支持回退和比较
Practice9:模块化设计 = 将Prompt分解为可复用的模块 | 提高设计效率和维护性
Practice10:上下文优化 = 优化Prompt的上下文使用效率 | 减少token消耗，提高响应质量
Practice11:错误预案 = 为常见错误设计预案和恢复机制 | 提高系统的鲁棒性
Practice12:性能监控 = 监控Prompt的性能指标和质量指标 | 及时发现问题并优化
Practice13:用户反馈 = 收集用户反馈并持续改进 | 确保Prompt满足实际需求
Practice14:兼容性考虑 = 考虑不同模型和环境的兼容性 | 确保Prompt的通用性
Practice15:安全性审查 = 定期审查Prompt的安全性和隐私保护 | 确保符合安全要求
Practice16:可维护性设计 = 设计清晰的结构和命名 | 便于后续修改和扩展
Practice17:知识更新 = 及时更新Prompt中的知识和信息 | 保持内容的时效性
Practice18:团队协作 = 建立团队协作机制和流程 | 支持多人共同设计和维护Prompt

; ================ Limits：限制条件 ================
[PUC\AGENT\Prompt\Limits]
__note__ = <E65-4> Limits 限制条件 | Prompt设计必须面对的现实约束
PUC\AGENT\Prompt\Limits_GUID = {36800D80-ACE7-4E03-AAF0-616D344EDEA4} | 节名GUID
LimitCount:限制条数 = 12 | 本节点定义的限制条件条目数
Limit1:上下文窗口限制 = 受模型架构限制，有最大token数 | 通常在4K-128K之间，超出会被截断
Limit2:记忆容量限制 = 长期记忆和每日记忆有容量限制 | 需要定期归档和清理
Limit3:工具可用性限制 = 工具可能不可用或受限 | 需要处理工具不可用的情况
Limit4:网络连接限制 = 某些操作需要网络连接 | 需要处理网络不可用的情况
Limit5:权限限制 = Agent的权限可能受限 | 不能执行超出权限的操作
Limit6:时效性限制 = 信息可能过时或不准确 | 需要验证信息的时效性
Limit7:准确性限制 = Agent可能产生错误或幻觉 | 需要验证和纠错机制
Limit8:复杂性限制 = 过于复杂的任务可能超出Agent能力 | 需要分解任务或寻求帮助
Limit9:资源限制 = 计算资源和存储资源有限 | 需要优化资源使用
Limit10:时间限制 = 任务执行有时间限制 | 需要控制执行时间
Limit11:法律限制 = 某些操作可能涉及法律风险 | 需要遵守法律法规
Limit12:道德限制 = 某些操作可能涉及道德问题 | 需要遵守道德准则

