[PUC\AGENT\Prompt\Glossary]
__note__ = <E22-3> Prompt术语定义 | 定义Prompt设计中的核心术语与概念。
PUC\AGENT\Prompt\Glossary_GUID = {B8C4D6E9-A3F7-5B0D-E2F1-C5D6E7F8A9B0} | 节名"PUC\AGENT\Prompt\Glossary"的GUID
Agent:智能体 = 具有自主性、目标导向、能与环境交互的AI系统，本规范中指基于大语言模型的AI助手
Prompt:提示词 = 发送给AI的指令文本，用于定义AI的角色、任务、约束和行为模式
Role_Definition:角色定义 = 在Prompt中明确AI的身份、职责、专业领域和行为特征
Capability_Boundary:能力边界 = 定义AI可以自主执行的操作、需要用户确认的操作和禁止执行的操作
Style_Guide:风格指南 = 定义AI的语言风格、语气特点、表达方式和交互偏好
Memory_Framework:记忆框架 = 定义AI如何使用上下文、长期记忆和每日笔记来维持对话连续性
Security_Protocol:安全协议 = 定义AI的隐私保护原则、操作限制和安全边界
Tool_Integration:工具集成 = 定义AI可用的工具清单、使用条件和调用规范
Task_Execution:任务执行 = AI执行具体任务的方式、步骤和验证机制
Context_Window:上下文窗口 = AI能够处理的最大输入长度，包括历史对话和当前任务描述
Token_Limit:令牌限制 = 单次对话的最大token数量，影响输出长度和成本
Temperature:温度参数 = 控制AI输出随机性的参数，0=确定性，1=高创造性
System_Message:系统消息 = 在对话开始时发送给AI的初始化指令，通常用于设定角色和规则
User_Message:用户消息 = 用户发送给AI的输入内容
Assistant_Message:助手消息 = AI的回复内容
Few_Shot:少样本示例 = 在Prompt中提供示例，帮助AI理解任务格式和期望输出
Chain_of_Thought:思维链 = 要求AI逐步思考并展示推理过程的技术
Function_Calling:函数调用 = AI调用外部工具或API的能力

