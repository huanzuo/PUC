; =============== Glossary 节点：术语定义 ===============
[PUC\AGENT\Prompt\Glossary]
__note__ = <E51-1> Glossary 节点 | Agent Prompt相关术语定义
Node_GUID:节点GUID = {90100C75-2F10-4451-B2C9-1DC77F258B1F} | 节名"PUC\AGENT\Prompt\Glossary"的唯一标识符
__note__ = <E51-2> 术语条目数量 | 共18个术语
Prompt:提示词 = 传递给AI智能体的指令集合 | 定义Agent的身份、能力、风格、约束等
RoleDefinition:角色定义 = Prompt中定义Agent身份和职责的部分 | 说明Agent是谁、能做什么
CapabilityBoundary:能力边界 = 明确Agent可以自主执行、需要确认、禁止的操作 | 三类边界：自主/确认/禁止
StyleGuide:风格指南 = 定义Agent的语言风格、语气、表达方式 | 包括正式/随意、简洁/详细等
MemoryFramework:记忆框架 = 定义Agent如何存储和检索上下文信息 | 包括短期记忆、长期记忆、每日笔记
SecurityProtocol:安全协议 = 定义Agent的安全约束和隐私保护规则 | 包括数据保护、操作权限
ToolIntegration:工具集成 = 定义Agent可用的外部工具和调用条件 | 包括命令行、API、文件操作等
ContextWindow:上下文窗口 = AI模型一次能处理的最大token数量 | 受模型架构限制
ContextDrift:语境漂移 = Agent在长时间对话中偏离原始角色的现象 | 需要通过锚点重置
ZeroDriftPoint:零偏移点 = 用于恢复Agent执行精度的锚点位置 | 通常是Prompt中的关键节点
SystemPrompt:系统提示词 = 传递给模型的基础级指令 | 设置模型的底层行为模式
UserPrompt:用户提示词 = 用户的具体请求和输入 | 触发Agent执行任务
AssistantResponse:助手响应 = Agent根据Prompt生成的回复 | 遵循Prompt中的所有约束
Temperature:温度参数 = 控制模型输出随机性的参数 | 0=确定性，1=高随机性
MaxTokens:最大Token数 = 限制单次响应的最大长度 | 防止输出过长或消耗过多资源
StopSequence:停止序列 | 触发模型停止生成的特定文本 | 用于控制输出格式
PromptTemplate:提示词模板 = 可重复使用的Prompt结构 | 用于快速生成特定类型的Prompt

; =============== Conventions 节点：命名约定 ===============
[PUC\AGENT\Prompt\Conventions]
__note__ = <E52-1> Conventions 节点 | Agent Prompt命名约定
