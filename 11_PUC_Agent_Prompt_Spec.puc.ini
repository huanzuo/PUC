Practice01:明确角色 = 在Prompt开头清晰定义AI的角色和职责，避免角色混淆和行为不一致。
Practice02:具体描述 = 使用具体的描述而非抽象概念，如"帮助用户解决VB5编程问题"而非"提供技术支持"。
Practice03:结构化组织 = 使用结构化的格式（标题、列表、表格）组织Prompt，提高可读性和可维护性。
Practice04:示例驱动 = 提供具体的输入输出示例，帮助AI理解期望的格式和行为。
Practice05:约束明确 = 明确列出所有约束条件，包括操作限制、输出格式、安全规则。
Practice06:工具列表 = 提供完整的工具清单和使用说明，确保AI知道何时和如何使用工具。
Practice07:记忆策略 = 定义清晰的记忆使用策略，包括何时检索、何时更新、如何压缩。
Practice08:错误处理 = 定义详细的错误处理流程，包括错误报告、恢复策略、日志记录。
Practice09:质量检查 = 建立质量检查机制，让AI能够自我验证输出质量和约束合规性。
Practice10:迭代优化 = 将Prompt视为持续迭代的过程，根据使用反馈不断优化和调整。
Practice11:版本管理 = 对Prompt进行版本管理，记录变更历史和优化方向。
Practice12:测试驱动 = 在实际使用前充分测试Prompt，覆盖各种场景和边界情况。
Practice13:用户反馈 = 积极收集用户反馈，了解Prompt的实际表现和改进方向。
Practice14:简洁有效 = 在保证完整性的前提下追求简洁，避免冗余信息干扰AI理解。
Practice15:上下文优化 = 优化上下文使用策略，在有限的token窗口内维持必要信息。
Practice16:安全第一 = 始终将安全放在首位，防止AI执行危险操作或泄露敏感信息。
Practice17:工具优先 = 优先使用已有的工具和skill，避免重复开发和资源浪费。
Practice18:文档同步 = 保持Prompt与工具文档同步，确保Prompt中的工具描述与SKILL.md一致。

