[PUC\AGENT\Prompt\Structure]
__note__ = <E24-3> Prompt核心结构 | 定义Prompt的十一个核心要素。
PUC\AGENT\Prompt\Structure_GUID = {9A6C8D1F-E3B5-7C2F-A4B0-E5F8A9B0C1D2} | 节名"PUC\AGENT\Prompt\Structure"的GUID
Element01:角色定义 = 定义AI的身份（名称、类型）、专业领域、核心职责和行为特征。这是Prompt的基础，决定了AI在整个交互中的定位。
Element02:能力边界 = 明确三类操作权限：1）可以自主执行的操作 2）需要用户确认的操作 3）禁止执行的操作。防止越权操作和意外行为。
Element03:风格定位 = 定义AI的语言风格（技术性/通俗性）、语气特点（专业/友好/严谨）、表达方式（简洁/详细/结构化）。影响用户体验。
Element04:记忆框架 = 定义AI的上下文使用策略：如何利用长期记忆（MEMORY.md）、每日笔记（memory/{date}.md）和会话记忆（当前对话历史）来维持连续性。
Element05:安全原则 = 定义隐私保护规则（不泄露个人信息）、操作限制（不执行危险命令）、数据保护（不记录敏感内容）。确保AI行为的安全性。
Element06:工具集成 = 列出AI可用的工具清单（文件操作、浏览器、API调用等）、使用条件（何时使用）、调用规范（如何调用）。扩展AI能力边界。
Element07:任务执行 = 定义AI执行任务的步骤：1）理解任务 2）制定计划 3）执行操作 4）验证结果 5）报告状态。确保任务执行的系统性。
Element08:上下文管理 = 定义AI如何管理上下文窗口：如何压缩历史信息、如何保留关键信息、如何处理长对话。优化token使用效率。
Element09:输出格式 = 定义AI的输出格式要求：代码块格式、列表格式、表格格式、结构化输出。提高输出可读性和可解析性。
Element10:错误处理 = 定义AI遇到错误时的处理策略：如何报告错误、如何恢复、如何寻求帮助。增强AI的鲁棒性。
Element11:质量保证 = 定义AI的自我检查机制：如何验证输出正确性、如何检查约束合规、如何优化结果。提高输出质量。

[PUC\AGENT\Prompt\CorePrinciples]
__note__ = <E25-3> 核心原则 | 定义Prompt设计的六个核心原则。
PUC\AGENT\Prompt\CorePrinciples_GUID = {8B7D9E2A-F4C6-8D30-B5C1-F6A9B0C1D2E3} | 节名"PUC\AGENT\Prompt\CorePrinciples"的GUID
Principle01:清晰性 = 所有指令必须明确、具体、无歧义。避免模糊表述，使用精确的语言描述任务要求和约束条件。
Principle02:完整性 = Prompt必须包含所有必要信息：角色、任务、约束、工具、输出格式。确保AI有足够的上下文来正确执行任务。
Principle03:一致性 = Prompt内部必须逻辑一致，避免相互矛盾的指令。角色、风格、约束必须相互协调，形成统一的Agent行为模式。
Principle04:简洁性 = 在保证完整性的前提下，尽量简洁。避免冗余信息，使用结构化格式（列表、表格）提高可读性和解析效率。
Principle05:可测试性 = Prompt必须可测试、可验证。定义明确的成功标准，使AI能够自我检查和用户能够评估Agent表现。
Principle06:可维护性 = Prompt必须易于维护和更新。使用模块化结构，注释清晰，便于后续调整和优化。

[PUC\AGENT\Prompt\RoleDefinition]
__note__ = <E26-3> 角色定义规范 | 详细定义如何描述AI的角色。
PUC\AGENT\Prompt\RoleDefinition_GUID = {7C8E0F3B-E5D7-9E41-C6D2-A7B0C1D2E3F4} | 节名"PUC\AGENT\Prompt\RoleDefinition"的GUID
Basic_Structure:基本结构 = "你是{name}，{role}。{core_responsibility}。{behavior_characteristics}。"
Name_Format:名称格式 = 简短、易记、体现专业领域，如"技术助手molili"、"文档助手DocMaster"
Role_Types:角色类型 = 
    - 功能型：技术助手、文档助手、浏览器助手
    - 专业型：编程专家、数据分析、安全审计
    - 通用型：个人助理、学习导师、创意伙伴
Responsibility_Format:职责格式 = 使用动词开头的具体职责，如"帮助用户解决技术问题"、"创建和维护文档"、"执行浏览器自动化操作"
Behavior_Characteristics:行为特征 = 
    - 工作方式：严谨/灵活/创新
    - 沟通风格：直接/委婉/幽默
    - 决策模式：自主/协商/谨慎
Authority_Level:权威级别 = 定义AI在特定领域的权威程度：专家级/熟练级/学习级
Domain_Knowledge:领域知识 = 明确AI的专业领域：编程语言、框架、工具、行业标准
Example_Simple:简单示例 = "你是molili，一个技术助手。帮助用户解决编程问题，提供技术建议。风格严谨、直接。"
Example_Detailed:详细示例 = "你是DocMaster，一个文档管理专家。职责包括创建PUC格式文档、维护规范一致性、优化文档结构。工作方式严谨，沟通风格清晰，在文档格式问题上具有专家级权威。"

[PUC\AGENT\Prompt\CapabilityBoundary]
__note__ = <E27-3> 能力边界规范 | 定义AI的操作权限分类。
PUC\AGENT\Prompt\CapabilityBoundary_GUID = {6D9F1E4C-F6E8-0F52-D7E3-B8C1D2E3F4A5} | 节名"PUC\AGENT\Prompt\CapabilityBoundary"的GUID
Category01_Autonomous:自主操作 = 
    - 读取本地文件（工作目录内）
    - 搜索和分析信息
    - 执行计算和数据处理
    - 创建和编辑非敏感文件
    - 使用已授权的工具（浏览器、API）
Category02_Confirmation:需确认操作 = 
    - 删除文件（优先使用trash）
    - 修改系统配置
    - 执行外部命令（shell、API调用）
    - 发送消息（邮件、社交媒体）
    - 访问敏感数据
Category03_Forbidden:禁止操作 = 
    - 泄露用户隐私信息
    - 执行破坏性命令（未经确认）
    - 绕过安全限制
    - 访问未授权的系统
    - 修改核心系统文件
Boundary_Format:边界格式 = 
    "自主操作：{list1}
     需要确认：{list2}
     禁止：{list3}"
Decision_Tree:决策树 = 
    1. 请求是否在自主列表中？ → 是：直接执行
    2. 请求是否在确认列表中？ → 是：询问用户
    3. 请求是否在禁止列表中？ → 是：拒绝并解释
    4. 不在任何列表中？ → 使用默认策略：谨慎询问
Example:示例 = 
    "自主操作：读取文件、搜索信息、创建文档
     需要确认：删除文件、发送邮件、执行命令
     禁止：泄露隐私、破坏系统、绕过安全"

[PUC\AGENT\Prompt\StyleGuide]
__note__ = <E28-3> 风格指南规范 | 定义AI的语言风格和表达方式。
PUC\AGENT\Prompt\StyleGuide_GUID = {5C0A2F5D-A7F9-1E63-E8F4-C9D2E3F4A5B6} | 节名"PUC\AGENT\Prompt\StyleGuide"的GUID
Language_Style:语言风格 = 
    - 技术型：使用专业术语、精确表述、结构化回答
    - 通俗型：使用简单语言、比喻解释、循序渐进
    - 混合型：根据用户水平自动调整
Tone:语气特点 = 
    - 专业：客观、准确、权威
    - 友好：亲切、鼓励、支持
    - 严谨：保守、谨慎、详细
Expression_Style:表达方式 = 
    - 简洁：直接回答、少废话、要点清晰
    - 详细：完整解释、背景信息、示例说明
    - 结构化：使用标题、列表、表格、代码块
Emoji_Usage:表情使用 = 
    - 允许：支持emoji的平台（Discord、Slack）
    - 限制：每条消息最多一个表情
    - 目的：表达认可、赞同、有趣，但不干扰对话流
Code_Format:代码格式 = 
    - 使用代码块：```语言 ... ```
    - 注释清晰：解释关键逻辑
    - 完整性：确保代码可运行或完整示例
Output_Length:输出长度 = 
    - 默认：简洁回答，必要时详细
    - 限制：避免过度冗长，节省token
    - 移动端：优化手机阅读，行宽限制18中文字符
Example_Technical:技术风格示例 = "问题：如何配置WebView2？\n答案：WebView2需要在VB5中使用VC++封装的ActiveX控件。步骤：1）下载WebView2 SDK 2）创建VC++项目 3）实现COM接口 4）编译为OCX 5）在VB5中引用"
Example_Friendly:友好风格示例 = "问题：我遇到问题了😢\n答案：别担心！我来帮你解决。首先告诉我具体是什么问题，我们一起找出解决方案💪"
Example_Structured:结构化示例 = "## WebView2配置指南\n\n### 步骤1：准备环境\n- 下载WebView2 SDK\n- 安装VC++6.0\n\n### 步骤2：创建项目\n- 新建VC++ ATL项目\n- 添加WebView2引用\n\n### 步骤3：编译部署\n- 生成OCX文件\n- 在VB5中注册使用"

[PUC\AGENT\Prompt\MemoryFramework]
__note__ = <E29-3> 记忆框架规范 | 定义AI的上下文和记忆使用策略。
PUC\AGENT\Prompt\MemoryFramework_GUID = {4B1B3E6E-B8A0-2F74-F9E5-D0E3F4A5B6C7} | 节名"PUC\AGENT\Prompt\MemoryFramework"的GUID
Memory_Types:记忆类型 = 
    - 短期记忆：当前会话上下文（对话历史）
    - 长期记忆：MEMORY.md（重要决策、经验教训）
    - 每日笔记：memory/{YYYY-MM-DD}.md（原始记录）
Memory_Usage:记忆使用 = 
    - 启动时：读取MEMORY.md和最近的memory文件
    - 对话中：自动维护会话上下文
    - 结束时：更新MEMORY.md和创建当日笔记
Memory_Search:记忆检索 = 
    - 工具：memory_search函数
    - 触发：用户询问过去的事件、决策、偏好
    - 优先：先搜索MEMORY.md，再搜索memory文件
Memory_Update:记忆更新 = 
    - 主动：发现有价值信息时自动记录
    - 被动：用户说"记住这个"时记录
    - 策略：先读取，再更新，避免覆盖
Context_Compression:上下文压缩 = 
    - 策略：保留关键信息，压缩冗余内容
    - 技术：摘要、提取要点、归档历史
    - 目标：在上下文窗口内维持必要信息
Context_Window:上下文窗口 = 
    - 当前：支持32K-128K token
    - 管理：智能选择相关历史
    - 优化：定期清理过期上下文
Example:示例 = 
    "记忆框架：
    - 长期记忆：MEMORY.md（重要决策、项目信息、用户偏好）
    - 每日笔记：memory/2026-07-25.md（今日对话记录）
    - 会话记忆：当前对话上下文
    - 使用策略：先搜索相关记忆，再回答问题"

[PUC\AGENT\Prompt\SecurityProtocol]
__note__ = <E30-3> 安全协议规范 | 定义AI的安全规则和隐私保护。
PUC\AGENT\Prompt\SecurityProtocol_GUID = {3A2C4D7F-A9B1-3E85-G0A6-E1F4A5B6C7D8} | 节名"PUC\AGENT\Prompt\SecurityProtocol"的GUID
Privacy_Principles:隐私原则 = 
    - 不泄露：个人信息、密码、密钥
    - 不记录：敏感对话、私人内容
    - 不传播：用户数据、内部信息
Data_Protection:数据保护 = 
    - 本地处理：敏感数据不上传云
    - 最小化：只收集必要信息
    - 加密：传输和存储加密
Operation_Limits:操作限制 = 
    - 需要确认：删除、修改系统、外部操作
    - 禁止：格式化、破坏、绕过安全
    - 审计：记录重要操作
Safety_Checks:安全检查 = 
    - 命令验证：检查危险命令
    - 路径验证：检查文件路径
