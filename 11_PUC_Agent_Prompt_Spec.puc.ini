__note__ = <E37-3> 质量指标 | 定义六个质量评估指标。
PUC\AGENT\Prompt\QualityMetrics_GUID = {D9K1L46-H0I8-0J52-N7H3-L8G1A2B3C4D5} | 节名"PUC\AGENT\Prompt\QualityMetrics"的GUID

Metric01_Clarity:清晰度 = 
    - 定义：指令是否明确、无歧义
    - 评估：用户能否准确理解AI的行为
    - 目标：100%的指令清晰明确
Metric02_Completeness:完整性 = 
    - 定义：Prompt是否包含所有必要信息
    - 评估：AI是否有足够上下文正确执行
    - 目标：覆盖所有核心要素（11个）
Metric03_Consistency:一致性 = 
    - 定义：Prompt内部是否逻辑一致
    - 评估：是否存在矛盾指令
    - 目标：零内部矛盾
Metric04_Effectiveness:有效性 = 
    - 定义：Prompt是否产生期望的Agent行为
    - 评估：用户满意度和任务完成率
    - 目标：90%+任务成功率
Metric05_Efficiency:效率性 = 
    - 定义：Prompt是否高效使用token
    - 评估：平均完成任务所需的token数
    - 目标：在保证效果前提下最小化token
Metric06_Maintainability:可维护性 = 
    - 定义：Prompt是否易于维护和更新
    - 评估：修改难度和更新频率
    - 目标：结构清晰，易于迭代

