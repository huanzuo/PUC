; ================ Glossary：术语定义 ================
[PUC\Database\Glossary]
__note__ = <0D02-03> Glossary 术语定义 | 数据库片段信息规范的语言基础
PUC\Database\Glossary_GUID = {5982F599-77D7-4104-985C-5F77E78552E9} | 节名GUID
TermCount:术语数 = 7 | 本节点定义的术语条目数
Database:数据库 = 结构化数据的持久化存储实体 | 如SQLite、MySQL、Access等
FragmentInfo:片段信息 = 描述数据库身份与配置的少量文本 | PUC只存这个
Schema:数据结构 = 表、字段、索引、关系的定义 | 用XML/SQL等描述性语言表达
DialectMark:特有标志 = 数据库方言、版本、扩展等身份特征 | 例如MySQL 8.0 InnoDB、SQLite WAL模式
SmallDB:小体量库 = 可附Schema的数据库 | 分界见[PUC\Database\SizeThreshold]
LargeDB:大体量库 = 只做描述的数据库 | 不保留Schema，只记片段
FingerprintDescription:指纹化描述 = 实体留存储，指纹(GUID+哈希+路径)+描述入PUC | 与99号Asset同源原则

; ================ FragmentInfo：片段信息规范 ================
[PUC\Database\FragmentInfo]
__note__ = <0D03-03> FragmentInfo 片段信息规范 | PUC记录数据库的四类片段
PUC\Database\FragmentInfo_GUID = {95CAE3CB-8F46-4CA7-9C91-0F8A18FFD671} | 节名GUID
Fragment1:片段1 = 配置 | 连接串、文件路径、引擎类型、账号引用（不含密码）
Fragment2:片段2 = 描述 | 数据库用途、内容概要、关键表说明
Fragment3:片段3 = 简介 | 一句话定位，便于清单浏览
Fragment4:片段4 = 特有标志 | 方言、版本、存储引擎、扩展、编码等身份特征
SecurityRule:安全规则 = 配置片段禁止包含密码/密钥 | 凭证类信息只记引用（如"密码见环境变量DB_PWD"）
Fingerprint:指纹字段 = 实体哈希 + 存储路径 + GUID | 用于校验数据库实体与片段描述的一致性

; ================ SchemaPolicy：结构保留策略 ================
[PUC\Database\SchemaPolicy]
__note__ = <0D04-03> SchemaPolicy 结构保留策略 | 什么库保留Schema，什么库只描述
PUC\Database\SchemaPolicy_GUID = {9D2CEB65-2ABD-48D9-8F44-CBC81C0A898C} | 节名GUID
SmallDBPolicy:小库策略 = 可通过XML/SQL等描述性语言保留数据结构 | Schema内联或通过MountFile挂载子文件
LargeDBPolicy:大库策略 = 只做描述性记录 | 不保留Schema，仅记片段信息
SchemaFormat:Schema格式 = DDL(SQL)或XML描述 | 二选一或并存，需标注方言
MountRule:挂载规则 = Schema超过50行时建议MountFile挂载 | 保持主文件轻量
StalenessRule:时效规则 = Schema与实体可能不同步 | 以实体哈希校验，失配时标注"Schema已过期"

; ================ SizeThreshold：大小分界 ================
[PUC\Database\SizeThreshold]
__note__ = <0D05-03> SizeThreshold 大小分界 | 小库与大库的划分建议（待用户确认）
PUC\Database\SizeThreshold_GUID = {80857FC2-B351-4423-89A9-CCFEE5024A07} | 节名GUID
SuggestedRule:建议规则 = 以Schema行数为首要分界 | 建议阈值：Schema≤50行 或 表数≤20 视为小库
FileSizeRule:文件大小参考 = 实体文件≤10MB 可视为小库 | 仅参考，Schema复杂度优先
WhySchemaFirst:为何以Schema为先 = PUC关心的是"结构能否低成本描述" | 与实体文件大小无关，与结构复杂度有关
Status:状态 = 待用户确认 | 阈值可由维护者按实际调整

; ================ AssetRelation：与99号Asset的关系 ================
[PUC\Database\AssetRelation]
__note__ = <0D06-03> AssetRelation 资产关系 | Database与Asset同源但分工不同
PUC\Database\AssetRelation_GUID = {A291B2B8-DD1C-4BA5-8364-B476FB45066F} | 节名GUID
SameOrigin:同源原则 = 两者都遵循指纹化描述 | 实体留存储，指纹+描述入PUC
Difference:分工区别 = Asset管非文本资产（图片/音频/视频），Database管结构化数据 | 数据库是"活的"结构化资产，Asset是"静的"媒体资产
Reference:互引关系 = Database可引用Asset记录其备份/导出文件的指纹 | Asset也可引用Database记录其元数据存放库
Independence:独立性 = Database保持独立二级节点 | 不并入Asset，因为数据库与运行时配置强相关

; ================ Checklist：检查清单 ================
[PUC\Database\Checklist]
__note__ = <0D07-03> Checklist 检查清单 | 数据库片段记录的8项核对表
PUC\Database\Checklist_GUID = {9CEC7811-E48B-4569-8351-A4671E69AF14} | 节名GUID
CheckItemCount:检查项目数 = 8 | 本节点定义的检查条目数
Check1:配置检查 = 连接串/路径/引擎是否齐全 | 无密码明文
Check2:描述检查 = 用途与内容概要是否清晰 | 可读
Check3:简介检查 = 一句话定位是否可快速浏览 | 清单友好
Check4:标志检查 = 方言/版本/扩展是否标注 | 身份特征
Check5:指纹检查 = 实体哈希与路径是否记录 | 可校验
Check6:Schema策略检查 = 小库是否附Schema、大库是否纯描述 | 分界正确
Check7:时效检查 = Schema与实体哈希是否一致 | 失配需标注过期
Check8:安全检查 = 凭证类信息是否只记引用不记内容 | 无泄露

