    ;      ☆Web/API/云技能不内建——通过MountFile挂载生态技能包
    ; ═══════════════ 发展预留 ═══════════
    ; ├─ ☆[PUC\???] <00F0-00FF> | 近未来顶层模块（规划区）
    ; ├─ ☆实例区 <0100-0FFF> | 独立子文档文件内编号
    ; └─ ☆远期 <1000-FFFE> | 大扩展区
    ; ================================================================================
DesignRationale:优化理由 = 
    - 六分层让"谁依赖谁"一目了然：基石→元数据→运行时→内容→机制→能力
    - 能力层内部依赖：PROMPT(基础) → AGENT(认知) → SKILLS(行动)，与"知→行顺序"一致
    - SKILLS做"元层"不做"库层"：意图语法在PUC，实现挂在生态技能包
    - Windows演进预判：类Win-API层出现时仅需新增backend标签"win-api"，意图层零改动
    - POSIX作为意图层的最小实现集与验证基准，长期稳定

