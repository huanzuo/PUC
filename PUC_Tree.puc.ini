    ; └─ ◇[PUC\SKILLS] <00E0-02> | 工具能力 | 现状=CMD小抄，需升级为意图契约 ★11/12
    ;      依赖方向：SKILLS消费PROMPT的能力边界（三类操作）+AGENT的认知对齐
    ;      ◇升级方向：命令字典 → 意图契约（意图/后端/权限/挂载点四字段）
