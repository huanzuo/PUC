; ============================================
; PUC Skills 规范 (v0.1-draft)
; 文件名: 11_PUC_Skills.puc.ini
; 说明：AI 技能能力规范
;       ①技能意图契约（Skill Contract）：AI能做什么、怎么做、
;         边界在哪——四字段：意图/后端/权限/挂载点
;       ②蒸馏反向描述规范（Distillation）：从实践蒸馏结果中
;         提炼出技能的方法与范围规范（与09号Prompt的可逆映射同构）
; 定位：能力层 | PUC\Skills <0B00-02> | 做"元层"不做"库层"
; 状态：草稿 v0.1，正文初稿
; 制定时间：2026-07-25
; ============================================

[PUC]
__note__ = <0000-01> PUC标志根节点头部分 | 保留节点，用作PUC文档的根标识与行为锚点（Behavior Anchor）。
PUC_GUID = {BDC7C3A5-EB99-4C9B-B89B-23A4BD1D43CA} | 节名"PUC"的GUID，键名"PUC_GUID"位于"__note__"之下，该节点为唯一及定位使用。
BehaviorAnchor:行为锚点 = 用于AI在执行PUC相关任务时的注意力重置、任务边界声明、执行模式约束。此锚点不参与动作，但作为AI行为的“偏移校正点”存在。
BehaviorAnchor_ExecutionMode:执行模式声明 = 
    - 本文档涉及的所有任务均以“工程执行模式（Execution Mode）”处理。
    - 禁止进入对话模式、情绪模式、拟人化模式。
    - 禁止推断、禁止省略、禁止自动合并任务。
    - 所有指令必须逐条执行，不得跳过、不得弱化。
BehaviorAnchor_TaskBoundary:任务边界声明 =
    - 每次任务包含静态指令（定义/约束）与动态指令（动作/生成）。
    - AI 必须同时处理静态与动态两类指令，不得偏移注意力。
    - 静态指令具有与动态指令等同的优先级。
    - 若出现冲突，以“任务边界声明”为最高优先级。
BehaviorAnchor_AttentionReset:注意力重置规则 =
    - 当上下文过长、注意力漂移、角色偏移时，AI 必须自动回到本锚点。
    - 本锚点作为“零偏移点（Zero-Drift Point）”用于恢复执行精度。
    - 若AI无法确定当前任务状态，必须回到此锚点重新建立任务边界。

; ================ PUC\Skills 根节点 ================
[PUC\Skills]
__note__ = <0B00-02> PUC\Skills 技能能力规范根节点 | 意图契约+蒸馏规范——技能生态的"元层"
PUC\Skills_GUID = {A4D6EBBD-B3FA-4D3E-90AA-F54EB4698467} | 节名GUID
Purpose:用途 = 定义AI技能的能力规范 | 技能意图契约 + 蒸馏反向描述
Positioning:定位 = 元层而非库层 | 技能商店已过剩，PUC只定义"如何声明技能意图、如何蒸馏技能"，不枚举具体技能
Principle:核心原则 = 意图与实现分离 | PUC管"做什么"（意图），生态管"怎么做"（实现），Toolchain管"用什么工具"（接入）
RelationshipToToolchain:与12号Toolchain的关系 = Skills管意图，Toolchain管工具接入 | MCP等外部工具协议归Toolchain，不归Skills

