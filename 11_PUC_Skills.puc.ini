; ================ Glossary：术语定义 ================
[PUC\Skills\Glossary]
__note__ = <0B02-03> Glossary 术语定义 | 技能能力规范的语言基础
PUC\Skills\Glossary_GUID = {7E4708A3-039C-4428-83B7-B14F4DF15D27} | 节名GUID
TermCount:术语数 = 8 | 本节点定义的术语条目数
Skill:技能 = AI具备的某项可复用能力 | 以意图契约描述，实现挂生态
SkillContract:技能意图契约 = 声明一项技能的意图/后端/权限/挂载点的四字段契约 | 本规范核心
Intent:意图 = 技能"做什么"的声明 | 与"怎么做"（实现）解耦
Backend:后端 = 技能实现所依赖的执行环境 | shell/posix/win-api/web/api等
Distillation:蒸馏 = 从实践结果中提炼技能规范的过程 | 反向描述，与Prompt可逆映射同构
EcosystemMount:生态挂载 = 将外部技能包挂载到PUC体系 | 通过MountFile机制，不复制内容
SkillLifecycle:技能生命周期 = 技能从诞生到废弃的过程 | 蒸馏→契约→挂载→复用→迭代→废弃
IntentImplementationGap:意图实现鸿沟 = "做什么"与"怎么做"之间的映射成本 | PUC通过Backend字段标注鸿沟，实现由生态填补

; ================ SkillContract：技能意图契约 ================
[PUC\Skills\SkillContract]
__note__ = <0B03-03> SkillContract 技能意图契约 | 一项技能的最小完整声明——四字段
PUC\Skills\SkillContract_GUID = {75E352BB-D807-499E-9D1F-64FC81BA4F40} | 节名GUID
FieldCount:字段数 = 4 | 意图/后端/权限/挂载点
ContractFormat:契约格式 = Intent:意图 = 描述 | 声明 + Backend:后端 = 标签 | 环境 + Permission:权限 = 级别 | 边界 + MountPoint:挂载点 = 文件 | 实现
MinimalityRule:最小性原则 = 契约只写四字段 | 失败处理、前置条件等留给生态实现层，基础层越薄越抗演进

[PUC\Skills\SkillContract\Intent]
__note__ = <0B04-04> Intent 意图字段 | 技能"做什么"的声明——意图与实现解耦
PUC\Skills\SkillContract\Intent_GUID = {C08D41F9-F562-466B-9932-817B8959E3D9} | 节名GUID
Format:格式 = 动词+对象 | 例如：创建目录、列出文件、下载资源、调用API
Rule1:规则1 = 只声明结果，不声明手段 | "创建目录"而非"执行mkdir"
Rule2:规则2 = 意图可跨后端复用 | 同一意图可映射到cmd/powershell/posix/win-api
Example:示例 = Intent:创建目录 = 在指定路径创建目录 | Backend:posix时实现为mkdir -p，Backend:win-api时实现为CreateDirectoryW

[PUC\Skills\SkillContract\Backend]
__note__ = <0B05-04> Backend 后端字段 | 技能实现所依赖的执行环境标签
PUC\Skills\SkillContract\Backend_GUID = {8399B117-5C48-496D-AAF0-26AE20C40926} | 节名GUID
Enum1:枚举1 = shell-cmd | Windows CMD环境
Enum2:枚举2 = shell-ps | PowerShell环境
Enum3:枚举3 = shell-posix | POSIX命令行（macOS/Linux）
Enum4:枚举4 = win-api | 类Win-API驱动层（预留，未来微软AI驱动层）
Enum5:枚举5 = web | 浏览器环境（DSH web等）
Enum6:枚举6 = api | 网络API调用
Enum7:枚举7 = cloud | 云服务接入
Extensible:可扩展性 = 后端枚举可随生态演进新增 | 新增后端时意图层零改动，仅加一个标签

[PUC\Skills\SkillContract\Permission]
__note__ = <0B06-04> Permission 权限字段 | 技能执行的权限级别——三类边界
PUC\Skills\SkillContract\Permission_GUID = {2509C314-8AD2-4AD0-8859-C834CA8A5D4C} | 节名GUID
Level1:级别1 = Autonomous自主 | 可自主执行：读文件、搜索、生成代码
Level2:级别2 = Confirm确认 | 需用户确认：发邮件、改配置、破坏性命令
Level3:级别3 = Forbidden禁止 | 禁止执行：泄露私密、猜测意图、绕过安全
AlignmentRule:对齐规则 = 与09号Prompt的CapabilityBoundary三类边界对齐 | 技能权限必须落入Prompt边界之内

[PUC\Skills\SkillContract\MountPoint]
__note__ = <0B07-04> MountPoint 挂载点字段 | 技能实现的生态位置——PUC只挂不抄
PUC\Skills\SkillContract\MountPoint_GUID = {6E318A45-527D-4683-A1FD-DFFB0CF34D39} | 节名GUID
Format:格式 = MountFile:技能名 = 文件名 | 前缀=<Environment变量>
Behavior:行为 = 纯文本模式下是普通键值行 | PUC编辑器总览模式下可展开外部技能包内容
Rule:规则 = PUC不复制技能包内容 | 生态技能库/商店的实现通过MountFile挂载引用
Example:示例 = MountFile:浏览器操作技能 = browser-skill.puc.ini | 前缀=<SkillsDir>

; ================ Distillation：蒸馏反向描述规范 ================
[PUC\Skills\Distillation]
__note__ = <0B08-03> Distillation 蒸馏反向描述 | 从实践蒸馏结果中提炼技能的方法与范围——与Prompt可逆映射同构
PUC\Skills\Distillation_GUID = {14BC9C9F-0359-4F88-BF05-CD925DDEF1D0} | 节名GUID
Core:核心思想 = 实践→蒸馏→技能契约→复用 | 与09号Prompt的"项目→提取→Prompt→复现"同构
Isomorphism:同构关系 = Prompt蒸馏产出"提示词"，Skills蒸馏产出"技能契约" | 两者共享可逆性哲学：好的实践可以逆向为规范，规范可以复现实践

[PUC\Skills\Distillation\Source]
__note__ = <0B09-04> Source 蒸馏来源 | 什么实践可以被蒸馏
PUC\Skills\Distillation\Source_GUID = {F8B088A0-8514-4805-A83B-645DE9B8108F} | 节名GUID
Source1:来源1 = 项目执行记录 | 项目中反复出现的操作序列，可提炼为技能
Source2:来源2 = 会话增量记录 | 05号SessionMemory的DELTA中沉淀的操作经验
Source3:来源3 = 外部技能包 | 从生态技能库中引入并本地化的技能
Requirement:来源要求 = 必须可追溯、可复现 | 蒸馏来源必须记录原始出处（项目/会话/文件）

[PUC\Skills\Distillation\Method]
__note__ = <0B0A-04> Method 蒸馏方法 | 从实践提炼技能契约的步骤
PUC\Skills\Distillation\Method_GUID = {EFB4DA46-6242-42BE-BFD1-EEC5E80D1E79} | 节名GUID
Step1:步骤1 = 识别意图 | 从实践序列中提取"做了什么"（动词+对象），剥离具体实现
Step2:步骤2 = 标注后端 | 标注该实践依赖的执行环境（shell/web/api等）
Step3:步骤3 = 划分权限 | 按三类边界标注技能的权限级别
Step4:步骤4 = 挂载实现 | 把具体实现放入生态技能包，PUC契约只写MountPoint
Step5:步骤5 = 验证复用 | 在新环境按契约复现实践，验证蒸馏无损

[PUC\Skills\Distillation\Scope]
__note__ = <0B0B-04> Scope 蒸馏范围 | 什么该蒸馏、什么不该蒸馏——边界规范
PUC\Skills\Distillation\Scope_GUID = {8F5F733A-43B0-43D6-9B7A-7C872EA4A9AE} | 节名GUID
Include1:应蒸馏 = 可复用的操作序列 | 出现2次以上且跨任务稳定的操作
Include2:应蒸馏 = 有明确边界的能力 | 能写清意图/后端/权限三字段的能力
Exclude1:不应蒸馏 = 一次性操作 | 只出现一次、无复用价值的操作
Exclude2:不应蒸馏 = 依赖特定环境的操作 | 无法标注通用后端、强依赖特定机器的操作
Exclude3:不应蒸馏 = 安全敏感操作 | 涉及凭证、私密数据的操作，只记方法不记内容
BoundaryRule:边界规则 = 蒸馏范围由用户确认 | AI可提议蒸馏候选，但入契约前必须经用户确认

[PUC\Skills\Distillation\Output]
__note__ = <0B0C-04> Output 蒸馏产物 | 蒸馏完成后的交付物与归档
PUC\Skills\Distillation\Output_GUID = {CFE2722B-CEE6-4B93-8EA1-6DB1BA5AA1E8} | 节名GUID
Output1:产物1 = 技能契约条目 | 按四字段格式写入[PUC\Skills]的契约区
Output2:产物2 = 生态技能包文件 | 具体实现写入生态技能包，通过MountPoint挂载
Output3:产物3 = 蒸馏记录 | 蒸馏来源/时间/操作者/验证结果写入归档
Archive:归档位置 = 蒸馏记录入05号SessionMemory的DELTA | 技能契约入本文件，实现入生态技能包

; ================ EcosystemMount：生态挂载 ================
[PUC\Skills\EcosystemMount]
__note__ = <0B0D-03> EcosystemMount 生态挂载 | 外部技能库/商店的接入规范
PUC\Skills\EcosystemMount_GUID = {9D2DA655-CE59-41C9-88B2-014FEB0DFAEB} | 节名GUID
Principle:原则 = 不复制、只挂载 | PUC不做第二个技能商店
MountMechanism:挂载机制 = MountFile保留键 | 与06号MountPoint规范一致
SourceTypes:来源类型 = 本地技能包 / 远程技能库 / MCP生态(经12号Toolchain接入) | 三者均通过挂载引用
Versioning:版本管理 = 挂载时声明技能包版本与兼容性 | 更新由生态侧完成，PUC侧只更新挂载引用
Security:安全 = 挂载的技能包必须标注权限级别 | 禁止挂载未标注权限的技能包

; ================ Checklist：检查清单 ================
[PUC\Skills\Checklist]
__note__ = <0B0E-03> Checklist 检查清单 | 技能契约与蒸馏的10项核对表
PUC\Skills\Checklist_GUID = {8280104A-7CD6-4548-95EC-E2E2279F8633} | 节名GUID
CheckItemCount:检查项目数 = 10 | 本节点定义的检查条目数
Check1:意图检查 = 意图是否只声明结果不声明手段 | 动词+对象格式
Check2:后端检查 = 后端标签是否已标注且可扩展 | 枚举内取值
Check3:权限检查 = 权限级别是否落入三类边界 | 与Prompt对齐
Check4:挂载点检查 = 实现是否通过MountPoint挂载 | 不复制内容
Check5:来源检查 = 蒸馏来源是否可追溯 | 出处记录
Check6:方法检查 = 蒸馏是否走完五步 | 识别→标注→划分→挂载→验证
Check7:范围检查 = 蒸馏对象是否在应蒸馏范围内 | 排除一次性/强环境/安全敏感
Check8:产物检查 = 契约条目/技能包/蒸馏记录三产物是否齐全 | 归档
Check9:复用检查 = 新环境按契约能否复现实践 | 无损验证
Check10:生态检查 = 挂载的技能包是否标注权限与版本 | 安全与兼容

