; ================ Glossary：术语定义 ================
[PUC\APP\Glossary]
__note__ = <0E02-03> Glossary 术语定义 | 应用程序配置规范的语言基础
PUC\APP\Glossary_GUID = {92A3FF50-C29C-4157-AA02-52A677DD5FEF} | 节名GUID
TermCount:术语数 = 6 | 本节点定义的术语条目数
APP:小应用程序 = 轻量工具、脚本、单文件或少量文件的应用 | 无独立安装程序
Application:标准应用程序 = 有安装程序、多文件、独立进程的标准应用 | 通常有注册表或配置目录
AppLedger:应用台账 = 系统里所有应用配置条目的汇总 | PUC\APP的本职
LaunchConfig:启动配置 = 应用的启动路径、命令、参数、工作目录 | 配置核心
Dependency:依赖 = 应用运行所需的运行时、库、版本 | 如.NET版本、VC运行时
Classification:划分标准 = APP与Application的分类依据 | 见[PUC\APP\Classification]

; ================ APPs：小应用程序区 ================
[PUC\APP\APPs]
__note__ = <0E03-03> APPs 小应用程序区 | 轻量工具的配置台账
PUC\APP\APPs_GUID = {5FB09B02-4F0A-4DCC-8ACC-B69B050F7165} | 节名GUID
EntryFormat:条目格式 = App-{GUID}:应用名 = 路径 | 备注 | 一应用一条目
ConfigFields:配置字段 = 名称 + 路径 + 启动命令 + 版本 + 用途 | 五个必填字段
Example:示例 = App-{GUID}:qrencode = C:\tools\qrencode.exe | 二维码生成小工具
Scope:适用范围 = 单文件工具、便携软件、脚本集合 | 无安装程序、即拷即用
MountHint:挂载提示 = 应用数量多时可拆分为独立文件 | MountFile挂载

; ================ Application：标准应用程序区 ================
[PUC\APP\Application]
__note__ = <0E04-03> Application 标准应用程序区 | 标准应用的配置台账
PUC\APP\Application_GUID = {EA306C4C-0F29-4022-AE85-1573C24F4477} | 节名GUID
EntryFormat:条目格式 = App-{GUID}:应用名 = 安装路径 | 备注 | 一应用一条目
ConfigFields:配置字段 = 名称 + 安装路径 + 启动命令 + 版本 + 依赖 + 卸载方式 | 六个必填字段
Example:示例 = App-{GUID}:VS_Code = C:\Program Files\VSCode\Code.exe | 依赖：无；卸载：卸载程序
Scope:适用范围 = 有安装程序、多文件、独立进程的标准应用 | 通常有注册表项或配置目录
DependencyNote:依赖说明 = 必须标注运行时依赖 | 如.NET 8、VC++2015、Java 17

; ================ Classification：划分标准 ================
[PUC\APP\Classification]
__note__ = <0E05-03> Classification 划分标准 | APP与Application的分类依据（待用户确认）
PUC\APP\Classification_GUID = {2D72FF91-916F-4564-80B3-2ECB27B9428B} | 节名GUID
Criterion1:标准1 = 安装形态 | 无安装程序（即拷即用）→APP；有安装程序→Application
Criterion2:标准2 = 文件规模 | 单文件或少量文件→APP；多文件目录结构→Application
Criterion3:标准3 = 进程形态 | 轻量工具→APP；独立进程+常驻服务→Application
Criterion4:标准4 = 生命周期 | 临时使用→APP；长期安装维护→Application
PriorityRule:优先级 = 安装形态为主，其余为辅 | 四项中任两项指向Application即归Application
Status:状态 = 待用户确认 | 分类阈值可按维护者习惯调整

; ================ Checklist：检查清单 ================
[PUC\APP\Checklist]
__note__ = <0E06-03> Checklist 检查清单 | 应用台账记录的8项核对表
PUC\APP\Checklist_GUID = {97B28705-01E1-4278-A0A3-343B112EBFF3} | 节名GUID
CheckItemCount:检查项目数 = 8 | 本节点定义的检查条目数
Check1:分类检查 = 应用是否归入正确的区 | APP还是Application
Check2:名称检查 = 应用名是否清晰可检索 | 清单友好
Check3:路径检查 = 路径是否存在且可启动 | 台账真实
Check4:命令检查 = 启动命令与参数是否完整 | 可执行
Check5:版本检查 = 版本号是否记录 | 可追踪
Check6:依赖检查 = Application是否标注运行时依赖 | 可迁移
Check7:卸载检查 = Application是否标注卸载方式 | 可维护
Check8:挂载检查 = 应用数量多时是否拆分独立文件挂载 | 主文件轻量

