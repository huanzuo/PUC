; ================ CorePrinciples：核心原则 ================
[PUC\Prompt\CorePrinciples]
__note__ = <P05-3> CorePrinciples 核心原则 | 提示词设计的6项铁律——不可妥协的底线
PUC\Prompt\CorePrinciples_GUID = {06C1E39F-D891-4B27-BED9-2924BF80DA5F} | 节名GUID
PrincipleCount:核心原则数 = 6 | 本节点定义的核心原则条目数
Principle1:清晰性原则 = Prompt必须清晰、明确、无歧义 | 避免模糊指令和矛盾要求
Principle2:完整性原则 = Prompt必须包含所有必要的约束和指导 | 确保AI有完整的行为指南
Principle3:一致性原则 = Prompt内部必须保持逻辑一致 | 避免规则冲突和指令矛盾
Principle4:最小性原则 = Prompt只包含必要的信息，避免冗余 | 减少token消耗，提高执行效率
Principle5:可测试性原则 = Prompt设计必须考虑测试和验证 | 确保质量可以通过实验评估
Principle6:可维护性原则 = Prompt结构清晰，易于修改和扩展 | 支持版本迭代和功能增强

