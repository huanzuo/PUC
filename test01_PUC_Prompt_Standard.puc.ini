; ============================================
; PUC 提示词标准 (v1.0-test01)
; 文件名: test01_PUC_Prompt_Standard.puc.ini
; 说明：AI提示词（Prompt）标准规范 —— 独立模块
;       提示词是面向AI的指令语言，无论Agent模式还是AI对话模式，
;       均以提示词为交互基础。本模块独立于PUC\AGENT体系之外，
;       可独立使用、可逆向转换（项目↔Prompt双向映射）。
; 定位：PUC\Prompt 独立根节点（与PUC\AGENT、PUC\SKILLS平级）
;       提示词规范模块 —— 可独立、可逆向转换。
; 核心特性：项目↔Prompt 双向可逆映射
;       正向：项目执行 → 提取关键信息 → 生成标准化Prompt → 分发
;       逆向：Prompt加载 → 配置环境 → 执行任务 → 无损复现项目
; 基于规范：PUC注释增强规范 v3.0.7 + PUC文件集规范 v3.0.6
;        + PUC-AI载入文档规范 v1.0 (06规范)
;        + PUC-AI_Knowledge_Base v1.0 (08规范)
; 号段：P00-PFF（Prompt独立模块专用，测试版占位）
; 制定时间：2026-07-25
; 修订时间：2026-07-25 | test01 融合版：Agent Prompt设计规范 + 提示词投喂可逆性标准
; ============================================

[PUC]
__note__ = <1-1> PUC标志根节点头部分 | 保留节点，用作PUC文档的根标识与行为锚点（Behavior Anchor）。
PUC_GUID = {BDC7C3A5-EB99-4C9B-B89B-23A4BD1D43CA} | 节名"PUC"的GUID，键名"PUC_GUID"位于"__note__"之下，该节点为唯一及定位使用。
BehaviorAnchor:行为锚点 = 用于AI在执行PUC相关任务时的注意力重置、任务边界声明、执行模式约束。此锚点不参与动作，但作为AI行为的"偏移校正点"存在。
BehaviorAnchor_ExecutionMode:执行模式声明 = 
    - 本文档涉及的所有任务均以"工程执行模式（Execution Mode）"处理。
    - 禁止进入对话模式、情绪模式、拟人化模式。
    - 禁止推断、禁止省略、禁止自动合并任务。
    - 所有指令必须逐条执行，不得跳过、不得弱化。
BehaviorAnchor_TaskBoundary:任务边界声明 =
    - 每次任务包含静态指令（定义/约束）与动态指令（动作/生成）。
    - AI 必须同时处理静态与动态两类指令，不得偏移注意力。
    - 静态指令具有与动态指令等同的优先级。
    - 若出现冲突，以"任务边界声明"为最高优先级。
BehaviorAnchor_AttentionReset:注意力重置规则 =
    - 当上下文过长、注意力漂移、角色偏移时，AI 必须自动回到本锚点。
    - 本锚点作为"零偏移点（Zero-Drift Point）"用于恢复执行精度。
    - 若AI无法确定当前任务状态，必须回到此锚点重新建立任务边界。

; ================ PUC\Prompt 独立模块根节点 ================
[PUC\Prompt]
__note__ = <P00-2> PUC\Prompt 提示词标准根节点 | 独立提示词规范模块——与AGENT、SKILLS平级，不隶属于任何子体系。
PUC\Prompt_GUID = {42C33156-375C-4751-82EA-0C13BDBF17FE} | 节名"PUC\Prompt"的唯一标识符
Purpose:用途 = AI提示词（Prompt）的标准化规范 | 涵盖设计、可逆映射、生成、分发、复现、质量控制的全生命周期
Independence:独立性声明 = 本模块独立于PUC\AGENT体系 | 提示词是通用交互语言，不专属Agent——Agent模式和AI对话模式均适用
Reversibility:可逆性声明 = 支持项目↔Prompt双向映射 | 正向（项目→Prompt生成）与逆向（Prompt→项目复现）均无损
Architecture:架构 = 
    [PUC\Prompt] 提示词标准根节
     ├─ 设计层 — Structure/CorePrinciples/RoleDefinition/... | 回答"Prompt怎么写"
     └─ 可逆层 — Reversibility/Extraction/Generation/... | 回答"Prompt如何与项目互转"
DesignPrinciple:设计原则 = 提示词是可逆向转换的指令载体 | 一份好Prompt既能被AI正确执行，也能完整复现其来源项目
Compatibility:兼容性 = 跨AI、跨平台、跨Agent/对话模式 | 无损移植

