Description:描述 = 
    - 提示词（Prompt）是面向AI的指令语言——本规范将其工程化、标准化、可逆化。
    - 独立模块定位：PUC\Prompt 与 PUC\AGENT、PUC\SKILLS 平级，不隶属任何子体系。
    - 核心特性：项目↔Prompt 双向可逆映射（正向生成 + 逆向复现），无损保证。
    - 双模式通用：Agent模式与AI对话模式均适用同一套提示词标准。
    - 融合来源：Agent Prompt设计规范（11号，已废弃）+ 提示词投喂可逆性标准（test版）。
StructureDescription:结构说明 = 
    - 采用标准PUC三层注释格式（__note__ + 键:注释 = 值 | 值注释）
    - 所有节点均使用真随机GUID标识，键名采用全路径格式（节名_GUID）
    - 节点编号遵循<N-M>规范：N为全局序号（P号段），M为层级深度（反斜杠数+1）
    - 信息融合到BOOT节点——不使用独立的__Info__/__Meta__/__Author__节点
DesignIntent:设计意图 = 
    - 提供完整的提示词设计规范，覆盖从设计到维护的全生命周期
    - 建立项目↔Prompt双向可逆映射机制，实现无损复现
    - 定义可量化的质量指标和可操作的检查清单，确保质量可控
    - 支持版本管理和迭代优化，适应不断变化的AI模型和能力
UsageScenario:使用场景 = 
    - AI开发者设计新提示词时参考本规范的结构骨架和模板
    - 项目完成后通过提取机制生成标准化Prompt存档
    - 在新AI环境通过复现机制无损重建项目效果
    - 提示词质量评估和审核时使用8维度质量指标
VersionHistory:版本历史 = 
    - v1.0-test01 (2026-07-25): 融合版，合并Agent Prompt设计规范与提示词投喂可逆性标准，确立PUC\Prompt独立模块定位
RelatedDocuments:相关文档 = 
    - 00_README.puc.ini: PUC总体介绍与体系树
    - 01_PUC_Comment_Enhancement_Spec.puc.ini: 注释增强规范（格式基础）
    - 02_PUC_Document_Set_Spec.puc.ini: 文档集规范（结构框架）
    - 06_PUC_AI_Launch_Spec.puc.ini: AI载入规范（提示词载入）
    - 08_PUC_AI_Knowledge_Base.puc.ini: 知识库规范（知识引用）
    - 11_PUC_Agent_Prompt_Spec.puc.ini: Agent Prompt设计规范（已废弃，被本文档取代）
    - test_PUC_Prompt_Standard.puc.ini: 提示词投喂可逆性标准（融合来源之二）

